<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CSE 160 Web Presence</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f7fb;
        color: #172033;
      }

      main {
        width: min(720px, calc(100% - 32px));
        padding: 32px;
        border: 1px solid #d7deea;
        border-radius: 8px;
        background: white;
        box-shadow: 0 10px 30px rgba(23, 32, 51, 0.08);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 6vw, 4rem);
        line-height: 1;
      }

      p {
        margin: 0;
        font-size: 1.1rem;
        line-height: 1.6;
      }

      .status {
        margin-top: 24px;
        font-weight: 700;
        color: #116a43;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello, GitHub Pages.</h1>
      <p>
        This is a test page for my CSE 160 web presence.
      </p>
      <p class="status">
        If you can see this online, the deployment worked.
      </p>
    </main>
  </body>
</html>
